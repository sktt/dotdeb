#unbind-key -a
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
bind-key c new-window -c '~'
bind-key '"' split-window -c '#{pane_current_path}'
bind-key % split-window -h -c '#{pane_current_path}'
bind-key -r -T prefix C-k resize-pane -U 5
bind-key -r -T prefix C-j resize-pane -D 5
bind-key -r -T prefix C-h resize-pane -L 5
bind-key -r -T prefix C-l resize-pane -R 5

set-option -g default-shell /bin/zsh
set-window-option -g mode-keys vi
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'
set-option -s set-clipboard off
set-option -g mouse on
# bind r source-file ~/.tmux.conf; display-message "Reloaded config"
set-option -g history-limit 3000
# set -s copy-command 'wl-copy'
#set -s copy-command 'pbcopy'
bind-key -Tcopy-mode-vi v send-keys -X begin-selection
#bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

set -g default-command "reattach-to-user-namespace -l ${SHELL}"
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'

# gnome? why ? is it xwayland or some shit?
#bind-key -Tcopy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -se c -i"
#bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "xclip -se c -i"

# sway
# bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
# bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "wl-copy"

# --- Layouts ---
bind-key m swap-pane -t :.0 \; select-pane -t :.0 \; select-layout main-vertical
bind-key M select-layout main-horizontal
bind-key t select-layout tiled
bind-key h select-layout even-horizontal
bind-key v select-layout even-vertical

# --- Window/pane management ---
bind-key < swap-window -t :- \; select-window -t :-
bind-key > swap-window -t :+ \; select-window -t :+
bind-key , move-pane -t :-
bind-key . move-pane -t :+
bind-key -r \{ swap-pane -U
bind-key -r \} swap-pane -D

bind n command-prompt "rename-window '%%'"   # Rename window (Prefix + n)

bind-key -n C-M-h previous-window
bind-key -n C-M-l next-window
bind-key -n C-M-j switch-client -p
bind-key -n C-M-k switch-client -n
unbind-key C-b
# collides with autocompletion..
# have to do double space now..
set-option -g prefix C-Space
bind-key C-Space send-prefix
set -sg escape-time 0 # Sticky esc key to act like Meta is Awful

set -g status-style "bg=colour234,fg=colour8"
set -g status-left "#{S:#[#{?session_attached,bg=colour236 fg=colour71,bg=colour234 fg=colour22}] #S #[default]}#[fg=colour238]│#{W:#[#{?window_active,bg=colour236 fg=colour3,bg=colour234 fg=colour101}] #I:#W }"
set -g status-left-length 220
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none
set -g status-justify left
setw -g window-status-format ""
setw -g window-status-current-format ""
set -g status-interval 5

# Status bar — sessions then windows, both in status-right
set -g status-right ""
set -g status-right-length 0

# Pane borders
set -g pane-border-style fg=colour246
set -g pane-active-border-style fg=colour21
setw -g clock-mode-colour colour39

set -g @vim_navigator_prefix_mapping_clear_screen 'none'
run '~/.tmux/plugins/tpm/tpm'

